<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus LMS - Educational Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #6366f1;
  --primary-light: #818cf8;
  --secondary: #ec4899;
  --accent: #8b5cf6;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --bg: #0a0e1a;
  --surface: rgba(15, 23, 42, 0.85);
  --surface-hover: rgba(30, 41, 59, 0.9);
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --border: rgba(99, 102, 241, 0.2);
  --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  --glow: 0 0 40px rgba(99, 102, 241, 0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

/* ===== ANIMATED BACKGROUND ===== */
.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.4;
  z-index: -1;
  animation: float 20s ease-in-out infinite;
}
.orb-1 { width: 400px; height: 400px; background: var(--primary); top: -100px; left: -100px; animation-delay: 0s; }
.orb-2 { width: 300px; height: 300px; background: var(--secondary); bottom: -50px; right: -50px; animation-delay: -5s; }
.orb-3 { width: 250px; height: 250px; background: var(--accent); top: 50%; left: 50%; animation-delay: -10s; }
.orb-4 { width: 200px; height: 200px; background: var(--success); bottom: 20%; left: 10%; animation-delay: -15s; opacity: 0.2; }

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(30px, -30px) scale(1.1); }
  50% { transform: translate(-20px, 20px) scale(0.9); }
  75% { transform: translate(20px, 10px) scale(1.05); }
}

/* ===== PARTICLES ===== */
.particles {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 4px; height: 4px;
  background: rgba(255,255,255,0.3);
  border-radius: 50%;
  animation: particle-rise 15s linear infinite;
}
@keyframes particle-rise {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* ===== GLASS CARD ===== */
.glass {
  background: var(--surface);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: var(--shadow);
}

.glass-hover {
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.glass-hover:hover {
  transform: translateY(-4px);
  box-shadow: var(--glow), var(--shadow);
  border-color: rgba(99, 102, 241, 0.4);
}

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 28px;
  border-radius: 14px;
  border: none;
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left 0.5s;
}
.btn:hover::before { left: 100%; }

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(99, 102, 241, 0.6);
}

.btn-secondary {
  background: rgba(255,255,255,0.1);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover {
  background: rgba(255,255,255,0.15);
  border-color: var(--primary-light);
}

.btn-danger {
  background: linear-gradient(135deg, var(--danger), #dc2626);
  color: white;
}

.btn-success {
  background: linear-gradient(135deg, var(--success), #059669);
  color: white;
}

/* ===== INPUTS ===== */
.input-group {
  position: relative;
  margin-bottom: 20px;
}
.input-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 500;
  color: var(--text-muted);
  font-size: 0.9rem;
}
.input-group input,
.input-group select,
.input-group textarea {
  width: 100%;
  padding: 14px 18px;
  background: rgba(15, 23, 42, 0.6);
  border: 2px solid rgba(99, 102, 241, 0.15);
  border-radius: 14px;
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  font-size: 1rem;
  transition: all 0.3s ease;
  outline: none;
}
.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
  background: rgba(15, 23, 42, 0.8);
}

/* ===== NAVIGATION ===== */
.nav-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  background: rgba(10, 14, 26, 0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 30px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.nav-logo {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.5rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary-light), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.nav-links {
  display: flex;
  gap: 8px;
}
.nav-link {
  padding: 8px 16px;
  border-radius: 10px;
  color: var(--text-muted);
  text-decoration: none;
  font-weight: 500;
  transition: all 0.3s;
  cursor: pointer;
}
.nav-link:hover, .nav-link.active {
  color: var(--text);
  background: rgba(99, 102, 241, 0.15);
}
.nav-user {
  display: flex;
  align-items: center;
  gap: 12px;
}
.avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.9rem;
}

/* ===== PAGE TRANSITIONS ===== */
.page {
  display: none;
  animation: pageIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  padding: 100px 30px 40px;
  max-width: 1400px;
  margin: 0 auto;
  min-height: 100vh;
}
.page.active { display: block; }
@keyframes pageIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== LOGIN PAGE ===== */
.login-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
}
.login-card {
  width: 100%;
  max-width: 440px;
  padding: 48px;
  position: relative;
  overflow: hidden;
}
.login-card::after {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent, var(--primary), transparent 30%);
  animation: rotate 4s linear infinite;
  opacity: 0.1;
  z-index: -1;
}
@keyframes rotate {
  100% { transform: rotate(360deg); }
}
.login-header {
  text-align: center;
  margin-bottom: 40px;
}
.login-header h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 2.2rem;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--primary-light), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.login-header p { color: var(--text-muted); }

/* ===== UNIT CARDS ===== */
.unit-card {
  padding: 28px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.unit-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 4px; height: 100%;
  background: linear-gradient(to bottom, var(--primary), var(--accent));
  border-radius: 24px 0 0 24px;
}
.unit-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  cursor: pointer;
}
.unit-number {
  display: inline-block;
  padding: 4px 14px;
  background: rgba(99, 102, 241, 0.2);
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--primary-light);
  margin-bottom: 8px;
}
.unit-title {
  font-size: 1.4rem;
  font-weight: 700;
}
.unit-toggle {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.3s;
  cursor: pointer;
}
.unit-toggle.rotated { transform: rotate(180deg); }

/* ===== LESSON ITEMS ===== */
.lessons-container {
  display: grid;
  gap: 12px;
  margin-top: 16px;
  padding-left: 16px;
}
.lesson-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  background: rgba(255,255,255,0.03);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.05);
  cursor: pointer;
  transition: all 0.3s;
}
.lesson-item:hover {
  background: rgba(255,255,255,0.07);
  border-color: var(--border);
  transform: translateX(8px);
}
.lesson-item.completed {
  opacity: 0.7;
}
.lesson-item.active {
  background: rgba(99, 102, 241, 0.1);
  border-color: rgba(99, 102, 241, 0.3);
}
.lesson-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
}
.lesson-icon.completed {
  background: linear-gradient(135deg, var(--success), #059669);
}
.lesson-info { flex: 1; }
.lesson-title { font-weight: 600; margin-bottom: 2px; }
.lesson-meta { font-size: 0.85rem; color: var(--text-muted); }
.check-icon {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--success);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn {
  from { transform: scale(0); }
  to { transform: scale(1); }
}

/* ===== MATERIAL VIEWER ===== */
.material-viewer {
  padding: 32px;
  min-height: 70vh;
}
.material-header {
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.material-type-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 12px;
}
.badge-pdf { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
.badge-quiz { background: rgba(99, 102, 241, 0.15); color: var(--primary-light); }
.badge-video { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }

.pdf-embed {
  width: 100%;
  height: 70vh;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.3);
}

/* ===== QUIZ INTERFACE ===== */
.quiz-container {
  max-width: 800px;
  margin: 0 auto;
}
.quiz-progress {
  display: flex;
  gap: 8px;
  margin-bottom: 32px;
}
.quiz-progress-dot {
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.1);
  transition: all 0.3s;
}
.quiz-progress-dot.active { background: var(--primary); }
.quiz-progress-dot.correct { background: var(--success); }
.quiz-progress-dot.wrong { background: var(--danger); }

.question-card {
  padding: 40px;
  margin-bottom: 24px;
}
.question-text {
  font-size: 1.3rem;
  font-weight: 600;
  margin-bottom: 28px;
  line-height: 1.5;
}

.options-grid {
  display: grid;
  gap: 12px;
}
.option-item {
  padding: 16px 20px;
  background: rgba(255,255,255,0.03);
  border: 2px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 12px;
}
.option-item:hover {
  border-color: var(--primary-light);
  background: rgba(99, 102, 241, 0.05);
}
.option-item.selected {
  border-color: var(--primary);
  background: rgba(99, 102, 241, 0.1);
}
.option-item.correct {
  border-color: var(--success);
  background: rgba(16, 185, 129, 0.1);
}
.option-item.wrong {
  border-color: var(--danger);
  background: rgba(239, 68, 68, 0.1);
}
.option-radio {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 2px solid var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.3s;
}
.option-item.selected .option-radio {
  border-color: var(--primary);
  background: var(--primary);
}
.option-radio::after {
  content: '';
  width: 8px; height: 8px;
  border-radius: 50%;
  background: white;
  transform: scale(0);
  transition: transform 0.2s;
}
.option-item.selected .option-radio::after { transform: scale(1); }

/* Matching */
.matching-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.match-item {
  padding: 14px 18px;
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1);
}
.match-select {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
}

/* Essay */
.essay-textarea {
  width: 100%;
  min-height: 200px;
  padding: 20px;
  background: rgba(255,255,255,0.03);
  border: 2px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  font-size: 1rem;
  resize: vertical;
  outline: none;
  transition: border-color 0.3s;
}
.essay-textarea:focus {
  border-color: var(--primary-light);
}

/* ===== ADMIN PANEL ===== */
.admin-grid {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 24px;
}
.admin-sidebar {
  padding: 24px;
  height: fit-content;
  position: sticky;
  top: 90px;
}
.admin-nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-radius: 12px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.3s;
  margin-bottom: 4px;
  font-weight: 500;
}
.admin-nav-item:hover, .admin-nav-item.active {
  background: rgba(99, 102, 241, 0.15);
  color: var(--text);
}

/* ===== DRAG AND DROP ===== */
.sortable-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.sortable-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  background: rgba(255,255,255,0.03);
  border: 2px dashed rgba(255,255,255,0.1);
  border-radius: 14px;
  cursor: grab;
  transition: all 0.3s;
}
.sortable-item:hover {
  border-color: var(--primary-light);
  background: rgba(99, 102, 241, 0.05);
}
.sortable-item.dragging {
  opacity: 0.5;
  transform: scale(1.02);
  border-color: var(--primary);
}
.drag-handle {
  color: var(--text-muted);
  cursor: grab;
}

/* ===== STUDENT RECORDS ===== */
.student-card {
  padding: 24px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.student-info h3 { margin-bottom: 4px; }
.student-info p { color: var(--text-muted); font-size: 0.9rem; }

/* ===== TOASTS ===== */
.toast-container {
  position: fixed;
  bottom: 30px;
  right: 30px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.toast {
  padding: 16px 24px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  gap: 12px;
  animation: toastIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: var(--shadow);
}
.toast.success { border-color: rgba(16, 185, 129, 0.3); }
.toast.error { border-color: rgba(239, 68, 68, 0.3); }
@keyframes toastIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* ===== LOADING ===== */
.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  gap: 24px;
}
.loading-spinner {
  width: 60px; height: 60px;
  border-radius: 50%;
  border: 3px solid rgba(99, 102, 241, 0.2);
  border-top-color: var(--primary);
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.loading-text {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.2rem;
  color: var(--text-muted);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.3s;
}
.modal-content {
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 32px;
  animation: scaleIn 0.3s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ===== STATS CARDS ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}
.stat-card {
  padding: 24px;
  position: relative;
  overflow: hidden;
}
.stat-card::after {
  content: '';
  position: absolute;
  top: -20px; right: -20px;
  width: 80px; height: 80px;
  border-radius: 50%;
  opacity: 0.1;
}
.stat-card.blue::after { background: var(--primary); }
.stat-card.pink::after { background: var(--secondary); }
.stat-card.green::after { background: var(--success); }
.stat-value {
  font-size: 2.2rem;
  font-weight: 800;
  margin: 8px 0;
  font-family: 'Space Grotesk', sans-serif;
}
.stat-label { color: var(--text-muted); font-size: 0.9rem; }

/* ===== CONFETTI ===== */
.confetti {
  position: fixed;
  width: 10px; height: 10px;
  z-index: 9999;
  animation: confetti-fall 3s ease-out forwards;
}
@keyframes confetti-fall {
  0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.5); }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .admin-grid { grid-template-columns: 1fr; }
  .admin-sidebar { position: static; }
  .page { padding: 90px 16px 30px; }
  .login-card { padding: 32px 24px; }
  .matching-container { grid-template-columns: 1fr; }
}

/* ===== UTILITY ===== */
.hidden { display: none !important; }
.text-center { text-align: center; }
.mb-4 { margin-bottom: 16px; }
.mt-4 { margin-top: 16px; }
.flex { display: flex; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: 8px; }
.gap-4 { gap: 16px; }
.w-full { width: 100%; }
</style>
</head>
<body>

<!-- Animated Background -->
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="bg-orb orb-3"></div>
<div class="bg-orb orb-4"></div>
<div class="particles" id="particles"></div>

<!-- Loading Screen -->

        <span>📊</span> Overview

      </div>

        <span>❓</span> Quizzes

<script>

// ==========================================
// CONFIGURATION
// ==========================================
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwLjgKqj_e2eaMBLhSBruACOh4zDnH54Qjq04nYpkXhBhNGdMiDvNeuXzmCAULhGgEF/exec',


  SHEET_ID: '1OnvFNlJlMGrxv6UCZAZmT2cJr1SG8j2AjRHOYWWWe7U'
};

// ==========================================
// STATE MANAGEMENT
// ==========================================
const state = {
  user: null,
  units: [],
  lessons: {},
  materials: {},
  quizzes: {},
  questions: {},
  progress: null,
  attempts: [],
  currentQuiz: null,
  currentMaterial: null,
  adminSection: 'overview',
  students: [],
  allMaterials: [],
  dragItem: null
};

// ==========================================
// API SERVICE
// ==========================================
const API = {
  async get(action, params = {}) {
    const query = new URLSearchParams({ action, ...params }).toString();
    const res = await fetch(`${CONFIG.API_URL}?${query}`);
    return res.json();
  },

  async post(action, data = {}) {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      body: JSON.stringify({ action, ...data })
    });
    return res.json();
  }
};

// For demo/development without backend
const MOCK_MODE = false;

// ==========================================
// UTILITIES
// ==========================================
function $(id) { return document.getElementById(id); }

function showToast(message, type = 'success') {
  const container = $('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${type === 'success' ? '✓' : '✗'}</span> <span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

function generateParticles() {
  const container = $('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (10 + Math.random() * 20) + 's';
    p.style.animationDelay = Math.random() * 15 + 's';
    p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
    container.appendChild(p);
  }
}

function createConfetti() {
  const colors = ['#6366f1', '#ec4899', '#8b5cf6', '#10b981', '#f59e0b'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

function hideLoading() {
  $('loadingScreen').style.display = 'none';
}

function formatDate(dateStr) {
  if (!dateStr) return 'N/A';
  return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ==========================================
// ROUTER
// ==========================================
function navigateTo(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $(`page-${page}`).classList.add('active');
  window.location.hash = page;

  if (page === 'dashboard') renderDashboard();
  if (page === 'profile') renderProfile();
  if (page === 'admin') renderAdmin();
}

// ==========================================
// AUTHENTICATION
// ==========================================
async function handleLogin(e) {
  e.preventDefault();
  const username = $('loginUsername').value.trim();
  const password = $('loginPassword').value;

  $('loadingScreen').style.display = 'flex';

  try {
    let result;
    if (MOCK_MODE) {
      // Mock login for testing
      if (username === 'admin' && password === 'admin') {
        result = { success: true, user: { name: 'Admin User', username: 'admin', role: 'admin' } };
      } else if (username === 'student' && password === 'student') {
        result = { success: true, user: { name: 'Test Student', username: 'student', role: 'student' } };
      } else {
        result = { success: false, message: 'Invalid credentials' };
      }
    } else {
      result = await API.get('login', { username, password });
    }

    if (result.success) {
      state.user = result.user;
      localStorage.setItem('nexus_user', JSON.stringify(result.user));
      setupNavigation();
      showToast(`Welcome back, ${result.user.name}!`);

      if (result.user.role === 'admin') {
        navigateTo('admin');
      } else {
        await loadStudentData();
        navigateTo('dashboard');
      }
    } else {
      showToast(result.message || 'Login failed', 'error');
    }
  } catch(err) {
    showToast('Connection error. Check API URL.', 'error');
    console.error(err);
  } finally {
    hideLoading();
  }
}

function setupNavigation() {
  $('navbar').classList.remove('hidden');
  $('navUsername').textContent = state.user.name;
  $('navAvatar').textContent = state.user.name.charAt(0).toUpperCase();

  const links = $('navLinks');
  links.innerHTML = '';

  if (state.user.role === 'student') {
    links.innerHTML = `
      <a class="nav-link active" onclick="navigateTo('dashboard')">Dashboard</a>
      <a class="nav-link" onclick="navigateTo('profile')">Profile</a>
    `;
  } else {
    links.innerHTML = `
      <a class="nav-link active" onclick="navigateTo('admin')">Admin</a>
    `;
  }
}

function logout() {
  state.user = null;
  localStorage.removeItem('nexus_user');
  $('navbar').classList.add('hidden');
  navigateTo('login');
  showToast('Logged out successfully');
}

async function checkAuth() {
  const saved = localStorage.getItem('nexus_user');
  if (saved) {
    state.user = JSON.parse(saved);
    setupNavigation();
    if (state.user.role === 'student') {
      await loadStudentData();
    }
    const hash = window.location.hash.replace('#', '') || 'dashboard';
    navigateTo(hash);
  }
  hideLoading();
}

// ==========================================
// STUDENT DATA LOADING
// ==========================================
async function loadStudentData() {
  if (MOCK_MODE) {
    // Mock data
    state.units = [
      { unit_id: 'u1', unit_number: 1, unit_name: 'Introduction to Programming' },
      { unit_id: 'u2', unit_number: 2, unit_name: 'Data Structures' }
    ];
    state.lessons['u1'] = [
      { lesson_id: 'l1', unit_id: 'u1', lesson_number: 1, lesson_name: 'Variables and Types' },
      { lesson_id: 'l2', unit_id: 'u1', lesson_number: 2, lesson_name: 'Control Flow' },
      { lesson_id: 'l3', unit_id: 'u1', lesson_number: 3, lesson_name: 'Functions' }
    ];
    state.materials['l1'] = [
      { material_id: 'm1', lesson_id: 'l1', title: 'Lecture Slides', type: 'pdf', content: 'https://drive.google.com/file/d/example/preview', order_index: 0 },
      { material_id: 'm2', lesson_id: 'l1', title: 'Quiz 1', type: 'quiz', content: '', order_index: 1 }
    ];
    state.progress = {
      username: state.user.username,
      current_unit_id: 'u1',
      current_lesson_id: 'l2',
      completed_lessons: ['l1'],
      completed_materials: ['m1', 'm2']
    };
    return;
  }

  try {
    const [unitsRes, progressRes] = await Promise.all([
      API.get('getUnits'),
      API.get('getStudentProgress', { username: state.user.username })
    ]);

    if (unitsRes.success) state.units = unitsRes.units;
    if (progressRes.success) state.progress = progressRes.progress;

    // Load lessons for each unit
    for (const unit of state.units) {
      const res = await API.get('getLessons', { unitId: unit.unit_id });
      if (res.success) state.lessons[unit.unit_id] = res.lessons;

      // Load materials for each lesson
      for (const lesson of res.lessons || []) {
        const matRes = await API.get('getMaterials', { lessonId: lesson.lesson_id });
        if (matRes.success) state.materials[lesson.lesson_id] = matRes.materials;
      }
    }
  } catch(err) {
    console.error('Error loading student data:', err);
  }
}

// ==========================================
// STUDENT DASHBOARD
// ==========================================
function renderDashboard() {
  const container = $('unitsContainer');
  const statsContainer = $('studentStats');
  $('studentName').textContent = state.user?.name || 'Student';

  if (!state.units.length) {
    container.innerHTML = '<div class="glass text-center" style="padding: 60px;"><p>No units available yet.</p></div>';
    return;
  }

  // Stats
  const completedLessons = state.progress?.completed_lessons?.length || 0;
  const totalLessons = Object.values(state.lessons).flat().length;
  const completedMaterials = state.progress?.completed_materials?.length || 0;

  statsContainer.innerHTML = `
    <div class="glass stat-card blue">
      <div class="stat-label">Completed Lessons</div>
      <div class="stat-value">${completedLessons}/${totalLessons}</div>
    </div>
    <div class="glass stat-card pink">
      <div class="stat-label">Materials Viewed</div>
      <div class="stat-value">${completedMaterials}</div>
    </div>
    <div class="glass stat-card green">
      <div class="stat-label">Current Unit</div>
      <div class="stat-value" style="font-size: 1.4rem;">${state.units.find(u => u.unit_id === state.progress?.current_unit_id)?.unit_name || 'Not started'}</div>
    </div>
  `;

  // Units
  container.innerHTML = state.units.map(unit => {
    const lessons = state.lessons[unit.unit_id] || [];
    const isExpanded = unit.unit_id === state.progress?.current_unit_id;

    return `
      <div class="glass unit-card glass-hover">
        <div class="unit-header" onclick="toggleUnit('${unit.unit_id}')">
          <div>
            <span class="unit-number">Unit ${unit.unit_number}</span>
            <h2 class="unit-title">${unit.unit_name}</h2>
          </div>
          <div class="unit-toggle ${isExpanded ? 'rotated' : ''}" id="toggle-${unit.unit_id}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
        <div class="lessons-container" id="lessons-${unit.unit_id}" style="display: ${isExpanded ? 'grid' : 'none'};">
          ${lessons.map(lesson => {
            const isCompleted = state.progress?.completed_lessons?.includes(lesson.lesson_id);
            const isActive = lesson.lesson_id === state.progress?.current_lesson_id;
            const materials = state.materials[lesson.lesson_id] || [];

            return `
              <div class="lesson-item ${isCompleted ? 'completed' : ''} ${isActive ? 'active' : ''}" onclick="openLesson('${lesson.lesson_id}')">
                <div class="lesson-icon ${isCompleted ? 'completed' : ''}">
                  ${isCompleted ? '✓' : lesson.lesson_number}
                </div>
                <div class="lesson-info">
                  <div class="lesson-title">${lesson.lesson_name}</div>
                  <div class="lesson-meta">${materials.length} materials</div>
                </div>
                ${isCompleted ? '<div class="check-icon">✓</div>' : ''}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function toggleUnit(unitId) {
  const el = $(`lessons-${unitId}`);
  const toggle = $(`toggle-${unitId}`);
  const isHidden = el.style.display === 'none';
  el.style.display = isHidden ? 'grid' : 'none';
  toggle.classList.toggle('rotated', isHidden);
}

function openLesson(lessonId) {
  state.currentLesson = lessonId;
  renderMaterialViewer(lessonId);
  navigateTo('material');
}

// ==========================================
// MATERIAL VIEWER
// ==========================================
async function renderMaterialViewer(lessonId) {
  const container = $('materialContent');
  const materials = state.materials[lessonId] || [];

  if (!materials.length) {
    container.innerHTML = '<div class="text-center" style="padding: 60px;"><p>No materials for this lesson yet.</p></div>';
    return;
  }

  let html = '';

  for (const mat of materials) {
    const isCompleted = state.progress?.completed_materials?.includes(mat.material_id);

    if (mat.type === 'pdf') {
      html += `
        <div class="material-header">
          <span class="material-type-badge badge-pdf">📄 PDF</span>
          <h2>${mat.title}</h2>
          ${isCompleted ? '<span style="color: var(--success);">✓ Completed</span>' : ''}
        </div>
        <iframe class="pdf-embed" src="${mat.content}" frameborder="0"></iframe>
        <div style="margin-top: 20px; text-align: center;">
          <a href="${mat.content.replace('/preview', '/view')}" target="_blank" class="btn btn-secondary">Open in New Tab</a>
          <button class="btn btn-success" onclick="markComplete('${mat.material_id}')" style="margin-left: 10px;">Mark as Complete</button>
        </div>
      `;
    } else if (mat.type === 'quiz') {
      // Get quiz and attempts
      let quiz = state.quizzes[mat.material_id];
      let attempts = [];

      if (!quiz && !MOCK_MODE) {
        const res = await API.get('getQuizzes', { materialId: mat.material_id });
        if (res.success && res.quizzes.length) {
          quiz = res.quizzes[0];
          state.quizzes[mat.material_id] = quiz;
        }
      }

      if (quiz && !MOCK_MODE) {
        const attRes = await API.get('getQuizAttempts', { username: state.user.username, quizId: quiz.quiz_id });
        if (attRes.success) attempts = attRes.attempts;
      }

      const lastAttempt = attempts[0];

      html += `
        <div class="material-header">
          <span class="material-type-badge badge-quiz">❓ Quiz</span>
          <h2>${mat.title}</h2>
          ${lastAttempt ? `<span style="color: var(--primary-light);">Last Score: ${lastAttempt.score}/${lastAttempt.max_score}</span>` : ''}
        </div>
        <div class="text-center" style="padding: 60px;">
          <p style="margin-bottom: 20px; color: var(--text-muted);">Test your knowledge with this quiz</p>
          <button class="btn btn-primary" onclick="startQuiz('${mat.material_id}', '${quiz?.quiz_id || ''}')">Start Quiz</button>
          ${lastAttempt ? `<button class="btn btn-secondary" style="margin-left: 10px;" onclick="startQuiz('${mat.material_id}', '${quiz?.quiz_id || ''}')">Retake</button>` : ''}
        </div>
      `;
    }
  }

  container.innerHTML = html;
}

async function markComplete(materialId) {
  if (!state.progress) {
    state.progress = { username: state.user.username, completed_lessons: [], completed_materials: [] };
  }
  if (!state.progress.completed_materials.includes(materialId)) {
    state.progress.completed_materials.push(materialId);
  }

  if (!MOCK_MODE) {
    await API.post('updateStudentProgress', state.progress);
  }

  showToast('Material marked as complete!');
  createConfetti();
  renderMaterialViewer(state.currentLesson);
}

// ==========================================
// QUIZ ENGINE
// ==========================================
async function startQuiz(materialId, quizId) {
  $('loadingScreen').style.display = 'flex';

  try {
    let questions = [];

    if (MOCK_MODE) {
      questions = [
        { question_id: 'q1', type: 'mcq', question_text: 'What is a variable?', options: ['A container for data', 'A function', 'A loop', 'None'], correct_answer: 0, points: 1 },
        { question_id: 'q2', type: 'true_false', question_text: 'Python is a compiled language.', options: ['True', 'False'], correct_answer: 1, points: 1 },
        { question_id: 'q3', type: 'essay', question_text: 'Explain the concept of recursion in your own words.', options: null, correct_answer: null, points: 5 }
      ];
    } else {
      const res = await API.get('getQuestions', { quizId });
      if (res.success) questions = res.questions;
    }

    state.currentQuiz = {
      materialId,
      quizId,
      questions,
      currentIndex: 0,
      answers: [],
      score: 0,
      maxScore: questions.reduce((a, q) => a + (q.points || 1), 0)
    };

    navigateTo('quiz');
    renderQuizQuestion();
  } catch(err) {
    showToast('Error loading quiz', 'error');
  } finally {
    hideLoading();
  }
}

function renderQuizQuestion() {
  const quiz = state.currentQuiz;
  const q = quiz.questions[quiz.currentIndex];
  const container = $('quizContent');

  // Progress dots
  const progressHtml = quiz.questions.map((_, i) => {
    let cls = '';
    if (i < quiz.currentIndex) {
      const ans = quiz.answers[i];
      cls = ans && ans.isCorrect ? 'correct' : 'wrong';
    } else if (i === quiz.currentIndex) {
      cls = 'active';
    }
    return `<div class="quiz-progress-dot ${cls}"></div>`;
  }).join('');

  let questionHtml = '';

  if (q.type === 'mcq') {
    questionHtml = `
      <div class="options-grid">
        ${q.options.map((opt, i) => `
          <div class="option-item" onclick="selectOption(${i})" data-index="${i}">
            <div class="option-radio"></div>
            <span>${opt}</span>
          </div>
        `).join('')}
      </div>
    `;
  } else if (q.type === 'true_false') {
    questionHtml = `
      <div class="options-grid">
        ${['True', 'False'].map((opt, i) => `
          <div class="option-item" onclick="selectOption(${i})" data-index="${i}">
            <div class="option-radio"></div>
            <span>${opt}</span>
          </div>
        `).join('')}
      </div>
    `;
  } else if (q.type === 'essay') {
    questionHtml = `
      <textarea class="essay-textarea" id="essayAnswer" placeholder="Write your answer here..."></textarea>
    `;
  } else if (q.type === 'matching') {
    const pairs = q.options || [];
    questionHtml = `
      <div class="matching-container">
        ${pairs.map((pair, i) => `
          <div class="match-item">
            <strong>${pair.left}</strong>
            <select class="match-select" id="match-${i}">
              <option value="">Select match...</option>
              ${pairs.map((p, j) => `<option value="${j}">${p.right}</option>`).join('')}
            </select>
          </div>
        `).join('')}
      </div>
    `;
  }

  container.innerHTML = `
    <div class="glass question-card">
      <div class="quiz-progress">${progressHtml}</div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <span style="color: var(--text-muted); font-size: 0.9rem;">Question ${quiz.currentIndex + 1} of ${quiz.questions.length}</span>
        <span style="color: var(--primary-light); font-weight: 600;">${q.points} pts</span>
      </div>
      <div class="question-text">${q.question_text}</div>
      ${questionHtml}
      <div style="margin-top: 32px; display: flex; justify-content: space-between;">
        ${quiz.currentIndex > 0 ? `<button class="btn btn-secondary" onclick="prevQuestion()">← Previous</button>` : '<div></div>'}
        <button class="btn btn-primary" onclick="nextQuestion()">
          ${quiz.currentIndex === quiz.questions.length - 1 ? 'Submit Quiz' : 'Next →'}
        </button>
      </div>
    </div>
  `;
}

function selectOption(index) {
  document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
  document.querySelector(`.option-item[data-index="${index}"]`).classList.add('selected');
}

function prevQuestion() {
  state.currentQuiz.currentIndex--;
  renderQuizQuestion();
}

function nextQuestion() {
  const quiz = state.currentQuiz;
  const q = quiz.questions[quiz.currentIndex];
  let answer = null;
  let isCorrect = false;

  if (q.type === 'mcq' || q.type === 'true_false') {
    const selected = document.querySelector('.option-item.selected');
    if (!selected) {
      showToast('Please select an answer', 'error');
      return;
    }
    answer = parseInt(selected.dataset.index);
    isCorrect = answer === q.correct_answer;
  } else if (q.type === 'essay') {
    answer = $('essayAnswer').value.trim();
    if (!answer) {
      showToast('Please write an answer', 'error');
      return;
    }
    isCorrect = null; // Will be graded manually
  } else if (q.type === 'matching') {
    const pairs = q.options || [];
    answer = [];
    let allCorrect = true;
    pairs.forEach((_, i) => {
      const val = $(`match-${i}`).value;
      answer.push({ left: i, right: parseInt(val) });
      if (parseInt(val) !== i) allCorrect = false;
    });
    isCorrect = allCorrect;
  }

  quiz.answers[quiz.currentIndex] = {
    question_id: q.question_id,
    type: q.type,
    answer: answer,
    isCorrect: isCorrect,
    points: isCorrect ? q.points : (isCorrect === null ? 0 : 0)
  };

  if (isCorrect) quiz.score += q.points;

  if (quiz.currentIndex < quiz.questions.length - 1) {
    quiz.currentIndex++;
    renderQuizQuestion();
  } else {
    submitQuiz();
  }
}

async function submitQuiz() {
  const quiz = state.currentQuiz;
  const hasEssay = quiz.answers.some(a => a.type === 'essay');

  $('quizContent').innerHTML = `

function setupDragAndDrop() {
  const list = $('sortableMaterials');
  if (!list) return;

  let draggedItem = null;

  list.querySelectorAll('.sortable-item').forEach(item => {
    item.addEventListener('dragstart', (e) => {
      draggedItem = item;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });

    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      draggedItem = null;
    });

    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (item === draggedItem) return;
      const rect = item.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      if (e.clientY < mid) {
        list.insertBefore(draggedItem, item);
      } else {
        list.insertBefore(draggedItem, item.nextSibling);
      }
    });
  });
}

  closeModal();
  await loadStudentData();
  renderAdmin();
}

async function submitMaterial() {
  const data = {
    lesson_id: $('materialLessonId').value,
    title: $('materialTitle').value,
    type: $('materialType').value,
    content: $('materialContent')?.value || ''
  };

  if (!MOCK_MODE) {
    await API.post('addMaterial', data);
  }

  showToast('Material added!');
  closeModal();
  await loadStudentData();
  renderAdmin();
}

async function submitQuestion() {
  const type = $('questionType').value;
  let options = null;
  let correct = null;

  if (type !== 'essay') {
    options = $('questionOptions').value.split('\n').map(s => s.trim()).filter(s => s);
    correct = parseInt($('questionCorrect').value);
  }

  const data = {
    quiz_id: $('questionQuizId').value,
    type: type,
    question_text: $('questionText').value,
    options: options,
    correct_answer: correct,
    points: parseInt($('questionPoints').value) || 1,
    order_index: 0
  };

  if (!MOCK_MODE) {
    await API.post('addQuestion', data);
  }

  showToast('Question added!');
  closeModal();
  renderAdmin();
}

async function submitImport() {
  try {
    const json = JSON.parse($('importJson').value);

    if (!MOCK_MODE) {
      await API.post('importQuiz', json);
    }

    showToast(`Imported ${json.questions.length} questions!`);
    closeModal();
    renderAdmin();
  } catch(err) {
    showToast('Invalid JSON format', 'error');
  }
}

// ==========================================
// INITIALIZATION
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
  generateParticles();
  checkAuth();
});

// Handle browser back/forward
window.addEventListener('hashchange', () => {
  const page = window.location.hash.replace('#', '') || 'login';
  if (page !== 'login' && !state.user) {
    navigateTo('login');
    return;
  }
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $(`page-${page}`).classList.add('active');
});
</script>
